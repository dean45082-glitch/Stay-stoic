name: Build Stay Stoic APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: audio-assets
          path: audio-store
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test audio controls without API calls
        run: node --test scripts/audio.test.cjs scripts/player.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy web app into Android assets
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html app.js data1.js data2.js app/src/main/assets/www/
          mkdir -p app/src/main/assets/www/vendor
          cp vendor/react.production.min.js vendor/react-dom.production.min.js app/src/main/assets/www/vendor/
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app-icon.b64 > app/src/main/res/drawable-nodpi/stoic_icon.webp
          base64 -d app-icon.b64 > app/src/main/assets/www/app-icon.webp
          base64 -d seneca.b64 > app/src/main/assets/www/seneca.webp
          base64 -d epictetus.b64 > app/src/main/assets/www/epictetus.webp
      - name: Package verified offline audio
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          node scripts/package-offline.cjs audio-store
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StayStoic-V2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StayStoic-V2-APK
          path: StayStoic-V2.apk
