name: Build Stay Stoic APK
on:
  workflow_dispatch:
  push:
    branches: [amazon-early-audio-2026-11]
permissions:
  contents: write
concurrency:
  group: stay-stoic-audio-generation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: audio-assets
          path: audio-store
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test audio controls without API calls
        run: |
          node --check c1-data.js
          node --check amazon-data.js
          node --check amazon-module.js
          node --check modules.js
          node --check app.js
          node --test scripts/audio.test.cjs scripts/player.test.cjs scripts/offline.test.cjs scripts/modules-storage.test.cjs
      - name: Fill early Amazon audio gaps under the verified cap
        env:
          XI_KEY: ${{ secrets.ELEVENLABS_API_KEY_SECONDARY }}
        run: |
          git -C audio-store config user.name 'github-actions[bot]'
          git -C audio-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          node scripts/generate-amazon-early.cjs audio-store --live
      - name: Collect the new MP3s and audio index
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const store = 'audio-store/';
          const ledger = JSON.parse(fs.readFileSync(store + 'ledger.json'));
          const batch = 'amazon-early-gaps-2026-11-balance';
          if (!ledger.batches?.[batch]) process.exit(0);
          fs.mkdirSync('audio-delta/audio', {recursive:true});
          for (const f of ['audio-index.json','audio-index.js']) fs.copyFileSync(store + f, 'audio-delta/' + f);
          for (const [id,entry] of Object.entries(ledger.entries)) {
            if (entry.batch === batch && entry.status === 'complete') {
              fs.copyFileSync(store + 'audio/' + id + '.mp3', 'audio-delta/audio/' + id + '.mp3');
            }
          }
          fs.writeFileSync('audio-delta/report.json', JSON.stringify(ledger.batches[batch], null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Amazon-early-audio-delta
          path: audio-delta/
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy web app into Android assets
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html app.js data1.js data2.js c1-data.js amazon-data-part1.js amazon-data-part2.js amazon-data-part3.js amazon-data-part4.js amazon-data-part5.js amazon-data-part6.js amazon-data-part7.js amazon-data-part8.js amazon-data-part9.js amazon-data-part10.js amazon-data-part11.js amazon-data-part12.js amazon-data-part13.js amazon-data-part14.js amazon-data-part15.js amazon-data-part16.js amazon-data-part17.js amazon-data-part18.js amazon-data.js amazon-module.js modules.js app/src/main/assets/www/
          mkdir -p app/src/main/assets/www/vendor
          cp vendor/react.production.min.js vendor/react-dom.production.min.js app/src/main/assets/www/vendor/
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app-icon.b64 > app/src/main/res/drawable-nodpi/stoic_icon.webp
          base64 -d app-icon.b64 > app/src/main/assets/www/app-icon.webp
          base64 -d seneca.b64 > app/src/main/assets/www/seneca.webp
          base64 -d epictetus.b64 > app/src/main/assets/www/epictetus.webp
      - name: Package verified offline audio
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          node scripts/package-offline.cjs audio-store
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StayStoicPlus-Amazon-audio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StayStoicPlus-Amazon-audio
          path: StayStoicPlus-Amazon-audio.apk

