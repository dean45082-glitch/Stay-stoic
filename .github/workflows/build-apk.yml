name: Build Stay Stoic APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy web app into Android assets
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html app.js data1.js data2.js app/src/main/assets/www/
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StayStoic-V2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StayStoic-V2-APK
          path: StayStoic-V2.apk
